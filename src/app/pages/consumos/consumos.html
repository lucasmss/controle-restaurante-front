<header>
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="#">
        Cafe Du Lucas
      </a>

      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="#">Home</a>
        <a class="nav-link" href="#">Sobre</a>
        <a class="nav-link" href="#">Contato</a>
        <a class="nav-link" href="/mesas">Mesas</a>
        <a class="nav-link active" href="/consumos">Consumos</a>
        <a class="nav-link" href="/cardapio">Cardápio</a>
      </div>
    </div>
  </nav>
</header>

<main>
  <div class="container py-4">

    <h1 class="text-center mb-2">
      Consumos
    </h1>

    <p class="text-center text-muted mb-4">
      Consumos abertos
    </p>

    <div class="row g-4">

      @for (consumo of consumosAbertos(); track consumo.id) {

        <div class="col-12 col-sm-6 col-md-4 col-lg-3">

          <div
            class="card h-100 shadow-sm mesa-disponivel"
            >

            <div class="card-body text-center">

              <h3 class="card-title">
                Mesa {{ consumo.mesa.numero }}
              </h3>

              <h5 class="card-text">
                {{ consumo.status }}
              </h5>

              <button
                class="btn btn-success"
                (click)="adicionarPedido()">
                Adicionar Pedido
              </button>

               <button
                class="btn btn-success"
                (click)="consumoMesaPagina(consumo.id)">
                Ver Consumo
              </button>

    
            </div>

          </div>

        </div>

      }

    </div>

  </div>
</main>

<footer class="bg-dark text-white text-center py-3">
  <h6>&copy; 2026 Cafe Du Lucas. Todos os direitos reservados.</h6>
</footer>
