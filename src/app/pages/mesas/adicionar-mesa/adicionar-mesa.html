<!-- MODAL ADICIONAR MESA -->
<div class="modal fade" id="modalAdicionarMesa" tabindex="-1" aria-labelledby="modalAdicionarMesaLabel"
    aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <!-- Cabeçalho -->
            <div class="modal-header bg-dark text-white">

                <h5 class="modal-title" id="modalAdicionarMesaLabel">
                    Adicionar Mesa
                </h5>

                <button id="btnFecharModalAdicionarMesa" type="button" class="btn-close btn-close-white"
                    data-bs-dismiss="modal" aria-label="Fechar">
                </button>

            </div>

            <!-- Corpo -->
            <div class="modal-body">

                <label for="numeroMesa" class="form-label">
                    Número da mesa
                </label>

                <input id="numeroMesa" type="number" class="form-control" min="1" step="1" placeholder="Ex.: 27"
                    [(ngModel)]="mesaNumero">

            </div>

            <!-- Rodapé -->
            <div class="modal-footer">

                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

                    Cancelar

                </button>

                <button type="button" class="btn btn-success" [disabled]="mesaNumero === null || mesaNumero < 1"
                    (click)="adicionarMesa()">

                    Salvar Mesa

                </button>

            </div>

        </div>

    </div>

</div>
