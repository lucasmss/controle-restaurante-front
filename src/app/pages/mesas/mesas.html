<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesas Disponíveis</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<h1 class="text-center">Mesas Disponíveis</h1>

<table class="table table-dark table-striped table-hover">
	<thead>
		<tr>
			<th scope="col">#</th>
			<th scope="col">Numero</th>
		</tr>
	</thead>
	<tbody>
		@for (mesa of mesas; track mesa.numero; let i = $index) {
			<tr>
				<th scope="row">{{ i + 1 }}</th>
				<td>
				  Mesa {{ mesa.numero }}
				</td>
			</tr>
		}
	</tbody>
</table>
</body>
</html>
