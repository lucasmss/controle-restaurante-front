<div class="modal fade" id="modalAdicionarPedido" tabindex="-1" aria-labelledby="modalAdicionarPedidoLabel" aria-hidden="true">

  <div class="modal-dialog modal-lg modal-dialog-centered">

    <div class="modal-content">

      <!-- Cabeçalho -->
      <div class="modal-header">
        <div>
          <h5 class="modal-title" id="modalAdicionarPedidoLabel">
            Adicionar Pedido
          </h5>

          <small class="text-muted">
            Mesa {{ mesaNumero }}
          </small>
        </div>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Fechar">
        </button>
      </div>

      <!-- Corpo -->
      <div class="modal-body">

        <!-- Lista de itens -->
        <div class="d-flex flex-column gap-3">

          @for (item of itensPedido; track $index) {

            <div class="row align-items-center g-2">

              <!-- Produto -->
              <div class="col">
                <select
                  class="form-select"
                  [(ngModel)]="item.produtoId">

                  <option [ngValue]="null">
                    Selecione um produto
                  </option>

                  @for (produto of produtos; track produto.id) {
                    <option
                      [ngValue]="produto.id">
                      {{ produto.name }} - R$ {{ produto.preco | number:'1.2-2' }}
                    </option>
                  }

                </select>
              </div>

              <!-- Quantidade -->
              <div class="col-auto">

                <div class="input-group">

                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    (click)="diminuirQuantidade(item)">
                    −
                  </button>

                  <span
                    class="input-group-text justify-content-center"
                    style="min-width: 50px;">
                    {{ item.quantidade }}
                  </span>

                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    (click)="aumentarQuantidade(item)">
                    +
                  </button>

                </div>

              </div>

              <!-- Remover -->
              <div class="col-auto">

                <button
                  type="button"
                  class="btn btn-outline-danger"
                  (click)="removerItem($index)"
                  title="Remover item">

                  🗑️

                </button>

              </div>

            </div>

          }

        </div>

        <!-- Adicionar nova linha -->
        <div class="text-center mt-4">

          <button
            type="button"
            class="btn btn-primary rounded-circle d-inline-flex align-items-center justify-content-center"
            style="width: 55px; height: 55px; font-size: 28px;"
            (click)="adicionarItem()">

            +

          </button>

          <div class="mt-2 text-muted">
            Adicionar outro item
          </div>

        </div>

      </div>

      <!-- Rodapé -->
      <div class="modal-footer">

        <button
          type="button"
          class="btn btn-secondary"
          data-bs-dismiss="modal">

          Cancelar

        </button>

        <button
          type="button"
          class="btn btn-success"
          (click)="fazerPedido()">

          Fazer pedido

        </button>

      </div>

    </div>

  </div>

</div>
